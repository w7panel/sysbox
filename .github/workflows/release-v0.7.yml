name: Release v0.7

on:
  push:
    tags:
      - "v0.7*"

defaults:
  run:
    shell: bash

permissions:
  contents: write
  packages: write

env:
  SYS_ARCH: amd64
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/sysbox-deploy-k3s
  PUSH_IMAGE: "true"
  VERIFY_IMAGE: "true"
  PACKAGE_CHART: "true"
  K3S_BASE_IMAGE: ghcr.io/nestybox/centos7/systemd
  UBUNTU_MIRROR: http://archive.ubuntu.com/ubuntu
  DOCKER_APT_MIRROR: https://download.docker.com/linux/ubuntu
  GOPROXY: https://proxy.golang.org,direct
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  TARGET_COMMITISH: ${{ github.sha }}

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          full_version="$(echo "${version}" | sed '/-[0-9]/!s/.*/&-0/')"

          echo "SYSBOX_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "CHART_VERSION=${full_version}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build and publish release
        run: ./w7panel-doc/release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysbox-${{ github.ref_name }}-release-files
          path: |
            dist/
            !dist/sysbox-ce_*.linux.tar.gz
