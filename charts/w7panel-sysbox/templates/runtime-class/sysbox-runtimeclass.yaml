apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ include "w7panel-sysbox.runtimeClassName" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler }}
scheduling:
  nodeSelector:
    {{ .Values.runtimeLabel.key }}: {{ .Values.runtimeLabel.value | quote }}
