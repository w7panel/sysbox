{{- if eq .Values.installMode "nested" }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox-runc-lite
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
handler: sysbox-runc-lite
{{- with .Values.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- else }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox-runc
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
handler: sysbox-runc
{{- with .Values.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox-runc-lite
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
handler: sysbox-runc-lite
{{- with .Values.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
