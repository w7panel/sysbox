apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ include "w7panel-sysbox.runtimeClassName" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
handler: sysbox-runc
{{- $nodeSelector := deepCopy .Values.nodeSelector }}
{{- if eq .Values.installMode "nested" }}
{{- $_ := set $nodeSelector "sysbox.w7panel.io/nested-runtime" "ready" }}
{{- end }}
{{- with $nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
