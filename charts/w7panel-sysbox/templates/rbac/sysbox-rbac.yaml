---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "w7panel-sysbox.serviceAccountName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "w7panel-sysbox.clusterRoleName" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "delete"]
{{- if .Values.admission.enabled }}
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "create", "update"]
{{- end }}
{{- if .Values.admission.enabled }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "w7panel-sysbox.clusterRoleName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "w7panel-sysbox.clusterRoleBindingName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "w7panel-sysbox.clusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "w7panel-sysbox.serviceAccountName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
{{- end }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "w7panel-sysbox.clusterRoleBindingName" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "w7panel-sysbox.clusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "w7panel-sysbox.serviceAccountName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
