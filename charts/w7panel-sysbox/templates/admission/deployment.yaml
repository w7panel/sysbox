{{- if .Values.admission.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "w7panel-sysbox.admissionName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysbox-admission
spec:
  replicas: {{ .Values.admission.replicas }}
  selector:
    matchLabels:
      {{- include "w7panel-sysbox.admissionSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.admission.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "w7panel-sysbox.admissionSelectorLabels" . | nindent 8 }}
        helm.sh/chart: {{ include "w7panel-sysbox.chart" . }}
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- end }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: sysbox-admission
        {{- with .Values.admission.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "w7panel-sysbox.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sysbox-admission
          image: {{ printf "%s:%s" (.Values.admission.image.repository | default .Values.installer.image.repository) (.Values.admission.image.tag | default .Values.installer.image.tag | default (printf "v%s" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.admission.image.pullPolicy | default .Values.installer.image.pullPolicy }}
          command:
            - "/usr/local/bin/sysbox-admission"
          args:
            - -addr=:9443
            - -bootstrap-webhook=true
            - -namespace={{ include "w7panel-sysbox.namespace" . }}
            - -service-name={{ include "w7panel-sysbox.admissionServiceName" . }}
            - -service-port=443
            - -webhook-name={{ include "w7panel-sysbox.admissionWebhookName" . }}
            - -ca-secret-name={{ include "w7panel-sysbox.admissionCASecretName" . }}
            - -tls-secret-name={{ include "w7panel-sysbox.admissionTLSSecretName" . }}
            - -lease-name={{ include "w7panel-sysbox.admissionLeaseName" . }}
            - -containerd-config-dir=/host/containerd
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          volumeMounts:
            - name: containerd-config
              mountPath: /host/containerd
              readOnly: true
      volumes:
        - name: containerd-config
          hostPath:
            path: {{ .Values.admission.containerdConfigPath | quote }}
            type: Directory
{{- end }}
