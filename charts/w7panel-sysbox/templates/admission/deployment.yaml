{{- if .Values.admission.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "w7panel-sysbox.admissionName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysbox-admission
spec:
  replicas: {{ .Values.admission.replicas }}
  selector:
    matchLabels:
      {{- include "w7panel-sysbox.admissionSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.admission.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "w7panel-sysbox.admissionSelectorLabels" . | nindent 8 }}
        helm.sh/chart: {{ include "w7panel-sysbox.chart" . }}
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- end }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: sysbox-admission
        {{- with .Values.admission.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "w7panel-sysbox.serviceAccountName" . }}
      nodeSelector:
        {{ .Values.runtimeLabel.key }}: {{ .Values.runtimeLabel.value | quote }}
        {{- with .Values.admission.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
        - key: {{ $.Values.runtimeLabel.key }}
          operator: Exists
          effect: NoSchedule
        {{- range .Values.admission.tolerations }}
        {{- if kindIs "map" . }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
      containers:
        - name: sysbox-admission
          image: {{ printf "%s:%s" .Values.daemonSet.image.repository (.Values.daemonSet.image.tag | default (printf "v%s" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.daemonSet.image.pullPolicy }}
          command:
            - {{ .Values.admission.binaryPath | quote }}
          args:
            - -addr=:{{ .Values.admission.containerPort }}
            - -bootstrap-webhook=true
            - -namespace={{ include "w7panel-sysbox.namespace" . }}
            - -service-name={{ include "w7panel-sysbox.admissionServiceName" . }}
            - -service-port={{ .Values.admission.service.port }}
            - -webhook-name={{ include "w7panel-sysbox.admissionWebhookName" . }}
            - -ca-secret-name={{ include "w7panel-sysbox.admissionCASecretName" . }}
            - -tls-secret-name={{ include "w7panel-sysbox.admissionTLSSecretName" . }}
            - -lease-name={{ include "w7panel-sysbox.admissionLeaseName" . }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: {{ .Values.admission.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          volumeMounts:
            - name: k3s-containerd-config
              mountPath: /var/lib/rancher/k3s/agent/etc/containerd
              readOnly: true
            - name: etc-containerd-config
              mountPath: /etc/containerd
              readOnly: true
            - name: usr-local-containerd-config
              mountPath: /usr/local/etc/containerd
              readOnly: true
      volumes:
        - name: k3s-containerd-config
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/containerd
            type: DirectoryOrCreate
        - name: etc-containerd-config
          hostPath:
            path: /etc/containerd
            type: DirectoryOrCreate
        - name: usr-local-containerd-config
          hostPath:
            path: /usr/local/etc/containerd
            type: DirectoryOrCreate
{{- end }}
