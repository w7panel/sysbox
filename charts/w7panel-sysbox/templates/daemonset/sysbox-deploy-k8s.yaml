---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "w7panel-sysbox.daemonSetName" . }}
  namespace: {{ include "w7panel-sysbox.namespace" . }}
  labels:
    {{- include "w7panel-sysbox.labels" . | nindent 4 }}
spec:
  selector:
      matchLabels:
        {{- include "w7panel-sysbox.selectorLabels" . | nindent 8 }}
  template:
    metadata:
        {{- with .Values.daemonSet.podAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        labels:
          {{- include "w7panel-sysbox.labels" . | nindent 10 }}
          {{ .Values.installLabel.key }}: {{ .Values.installLabel.value | quote }}
          {{- with .Values.daemonSet.podLabels }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
    spec:
      serviceAccountName: {{ include "w7panel-sysbox.serviceAccountName" . }}
      nodeSelector:
        {{ .Values.installLabel.key }}: {{ .Values.installLabel.value | quote }}
        {{- with .Values.daemonSet.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
        {{- range .Values.daemonSet.tolerations }}
        - key: {{ $.Values.runtimeLabel.key }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
      - name: {{ include "w7panel-sysbox.name" . }}
        image: {{ printf "%s:%s" .Values.daemonSet.image.repository (.Values.daemonSet.image.tag | default (printf "v%s" .Chart.AppVersion)) | quote }}
        imagePullPolicy: {{ .Values.daemonSet.image.pullPolicy }}
        command: [ "bash", "-c", "/opt/sysbox/scripts/sysbox-deploy-k8s.sh ce install" ]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-etc
          mountPath: /mnt/host/etc
        - name: host-osrelease
          mountPath: /mnt/host/os-release
        - name: host-dbus
          mountPath: /var/run/dbus
        - name: host-run-systemd
          mountPath: /run/systemd
        - name: host-lib-systemd
          mountPath: /mnt/host/lib/systemd/system
        - name: host-etc-systemd
          mountPath: /mnt/host/etc/systemd/system
        - name: host-lib-sysctl
          mountPath: /mnt/host/lib/sysctl.d
        - name: host-opt-lib-sysctl
          mountPath: /mnt/host/opt/lib/sysctl.d
        - name: host-usr-bin
          mountPath: /mnt/host/usr/bin
        - name: host-opt-bin
          mountPath: /mnt/host/opt/bin
        - name: host-usr-local-bin
          mountPath: /mnt/host/usr/local/bin
        - name: host-opt-local-bin
          mountPath: /mnt/host/opt/local/bin
        - name: host-usr-lib-mod-load
          mountPath: /mnt/host/usr/lib/modules-load.d
        - name: host-opt-lib-mod-load
          mountPath: /mnt/host/opt/lib/modules-load.d
        - name: host-run
          mountPath: /mnt/host/run
        - name: host-var-lib
          mountPath: /mnt/host/var/lib
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-osrelease
          hostPath:
            path: /etc/os-release
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
        - name: host-run-systemd
          hostPath:
            path: /run/systemd
        - name: host-lib-systemd
          hostPath:
            path: /lib/systemd/system
        - name: host-etc-systemd
          hostPath:
            path: /etc/systemd/system
        - name: host-lib-sysctl
          hostPath:
            path: /lib/sysctl.d
        - name: host-opt-lib-sysctl
          hostPath:
            path: /opt/lib/sysctl.d
        - name: host-usr-bin
          hostPath:
            path: /usr/bin/
        - name: host-opt-bin
          hostPath:
            path: /opt/bin/
        - name: host-usr-local-bin
          hostPath:
            path: /usr/local/bin/
        - name: host-opt-local-bin
          hostPath:
            path: /opt/local/bin/
        - name: host-usr-lib-mod-load
          hostPath:
            path: /usr/lib/modules-load.d
        - name: host-opt-lib-mod-load
          hostPath:
            path: /opt/lib/modules-load.d
        - name: host-run
          hostPath:
            path: /run
        - name: host-var-lib
          hostPath:
            path: /var/lib
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
