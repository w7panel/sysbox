nodeSelector: {}

installMode: host

# RuntimeClass names are standard and fixed. Host mode creates both
# sysbox-runc and sysbox-runc-lite; nested mode creates sysbox-runc-lite only.
# Kept only for compatibility with older callers; it does not rename handlers.
runtimeClassName: sysbox-runc

installer:
  enabled: true
  image:
    repository: ghcr.registry.cdn.w7.cc/w7panel/sysbox-deploy-k3s
    tag: ""
    pullPolicy: Always
  podLabels: {}
  podAnnotations: {}

admission:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  containerdConfigPath: /var/lib/rancher/k3s/agent/etc/containerd
  podLabels: {}
  podAnnotations: {}

snapshotter:
  enabled: false
