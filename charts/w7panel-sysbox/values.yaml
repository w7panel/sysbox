# Required. Set this explicitly to either "host" (L0) or "nested" (L1).
# The empty default intentionally makes Helm validation fail instead of
# accidentally running the host installer in an inner K3s cluster.
installMode: ""

nodeSelector: {}

installer:
  image:
    repository: docker.cnb.cool/i0358/zpk/sysbox-deploy-k3s
    tag: ""
    # A digest takes precedence over tag and is recommended for releases.
    digest: sha256:0b85c10dad9599c407fc29b555377f615f398d07b3580e342ed50bb3b2b44423
    pullPolicy: Always
  podLabels: {}
  podAnnotations: {}

admission:
  enabled: false
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: ""
  replicas: 1
  containerdConfigPath: /var/lib/rancher/k3s/agent/etc/containerd
  podLabels: {}
  podAnnotations: {}

snapshotter:
  enabled: false

nested:
  pauseImage: rancher/mirrored-pause:3.6
