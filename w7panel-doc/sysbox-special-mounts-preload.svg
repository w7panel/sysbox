<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
  <title id="title">Sysbox 特殊挂载目录与 disable-inner-image-preload 关系图</title>
  <desc id="desc">展示 Kubernetes Deployment 创建 Sysbox Pod 后，sysbox-runc 识别指定目录、sysbox-mgr 创建宿主独立卷并绑定到 Pod，默认模式与 disable-inner-image-preload 模式下 SyncIn 和 SyncOut 的区别，以及两种同步操作的触发时机、源路径和目标路径。</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="podHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hostHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 31px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #526078; }
      .section { font-size: 20px; font-weight: 700; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #526078; }
      .tiny { font-size: 12px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
      .blue { fill: #1d4ed8; }
      .green { fill: #047857; }
      .orange { fill: #c2410c; }
      .red { fill: #b91c1c; }
    </style>
  </defs>

  <rect width="1600" height="1300" fill="url(#pageBg)"/>

  <!-- Title -->
  <text class="title" x="60" y="51">Sysbox 指定挂载目录 × Pod × inner image preload</text>
  <text class="subtitle" x="60" y="80">特殊挂载决定“数据放在哪里”；preload 参数只决定“停止时是否回写 rootfs”</text>
  <rect x="1240" y="28" width="300" height="45" rx="22" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="1267" cy="50" r="10" fill="#f97316"/>
  <text class="body orange" x="1287" y="56" font-weight="700">按当前 sysbox-mgr 代码行为</text>

  <!-- Call chain -->
  <g filter="url(#shadow)">
    <rect x="60" y="108" width="1480" height="78" rx="14" fill="#ffffff"/>
  </g>
  <text class="small" x="83" y="133" font-weight="700">创建链路</text>

  <g>
    <rect x="170" y="122" width="205" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="card-title blue" x="272" y="151" text-anchor="middle">Deployment</text>
    <line x1="375" y1="146" x2="438" y2="146" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="445" y="122" width="205" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="card-title blue" x="547" y="151" text-anchor="middle">Sysbox Pod</text>
    <line x1="650" y1="146" x2="713" y2="146" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="720" y="122" width="205" height="48" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text class="card-title" x="822" y="151" text-anchor="middle" fill="#4338ca">sysbox-runc</text>
    <line x1="925" y1="146" x2="988" y2="146" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="995" y="122" width="205" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="card-title green" x="1097" y="151" text-anchor="middle">sysbox-mgr</text>
    <line x1="1200" y1="146" x2="1263" y2="146" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="1270" y="122" width="205" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="card-title green" x="1372" y="151" text-anchor="middle">宿主独立卷</text>
  </g>

  <!-- Architecture title -->
  <text class="section" x="60" y="222">① 指定目录的作用：将 Pod 内层运行时数据放到独立宿主文件系统</text>

  <!-- Pod card -->
  <g filter="url(#shadow)">
    <rect x="60" y="244" width="690" height="329" rx="17" fill="#ffffff"/>
  </g>
  <path d="M77 244 H733 A17 17 0 0 1 750 261 V294 H60 V261 A17 17 0 0 1 77 244 Z" fill="url(#podHead)"/>
  <text class="card-title white" x="88" y="277">Kubernetes Pod · 系统容器（Container ID = A）</text>

  <rect x="86" y="316" width="638" height="207" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="card-title" x="110" y="346">Pod rootfs 中被 Sysbox 识别的指定目录</text>
  <circle cx="111" cy="376" r="4" fill="#2563eb"/>
  <text class="body mono" x="126" y="381">Docker data-root（默认 /var/lib/docker）</text>
  <circle cx="111" cy="406" r="4" fill="#2563eb"/>
  <text class="body mono" x="126" y="411">/var/lib/kubelet　·　/var/lib/k0s</text>
  <circle cx="111" cy="436" r="4" fill="#2563eb"/>
  <text class="body mono" x="126" y="441">K3s &lt;data-dir&gt;/agent（默认 /var/lib/rancher/k3s/agent）</text>
  <circle cx="111" cy="466" r="4" fill="#2563eb"/>
  <text class="body mono" x="126" y="471">RKE2 &lt;data-dir&gt;　·　/var/lib/buildkit</text>
  <circle cx="111" cy="496" r="4" fill="#2563eb"/>
  <text class="body mono" x="126" y="501">/var/lib/containerd/io.containerd.snapshotter.v1.overlayfs</text>

  <rect x="86" y="535" width="638" height="24" rx="8" fill="#fff7ed"/>
  <text class="small orange" x="405" y="552" text-anchor="middle">运行时这些 rootfs 路径会被 bind mount 覆盖，实际读写落到宿主独立卷</text>

  <!-- Host card -->
  <g filter="url(#shadow)">
    <rect x="850" y="244" width="690" height="329" rx="17" fill="#ffffff"/>
  </g>
  <path d="M867 244 H1523 A17 17 0 0 1 1540 261 V294 H850 V261 A17 17 0 0 1 867 244 Z" fill="url(#hostHead)"/>
  <text class="card-title white" x="878" y="277">宿主节点 · sysbox-mgr 管理的 per-container backing volume</text>

  <rect x="876" y="316" width="638" height="207" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="card-title green" x="900" y="346">/var/lib/sysbox/&lt;类型&gt;/A</text>
  <text class="body mono" x="900" y="380">docker/A　　　　　kubelet/A　　　　　k0s/A</text>
  <text class="body mono" x="900" y="412">rancher-k3s/A　　 rancher-rke2/A</text>
  <text class="body mono" x="900" y="444">buildkit/A　　　　containerd/A</text>
  <line x1="900" y1="462" x2="1490" y2="462" stroke="#a7f3d0"/>
  <text class="body green" x="900" y="488" font-weight="700">主要作用</text>
  <text class="small" x="982" y="488">提供适合内层 overlayfs 的文件系统语义；隔离高频运行时 I/O</text>
  <text class="small red" x="900" y="512" font-weight="700">它不是 Kubernetes Volume / PVC，不应作为 Pod 持久化边界</text>

  <rect x="876" y="535" width="638" height="24" rx="8" fill="#ecfdf5"/>
  <text class="small green" x="1195" y="552" text-anchor="middle">目录按 Container ID 管理；Pod 重建通常会获得新的 ID 与独立卷</text>

  <!-- Bind mount arrow -->
  <path d="M850 389 C812 389 800 389 762 389" fill="none" stroke="#059669" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="758" y="334" width="86" height="39" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text class="small green" x="801" y="350" text-anchor="middle" font-weight="700">rbind</text>
  <text class="tiny" x="801" y="365" text-anchor="middle">rprivate</text>
  <path d="M750 467 C788 467 812 467 850 467" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="tiny" x="800" y="486" text-anchor="middle">生命周期同步</text>

  <!-- Mode comparison -->
  <text class="section" x="60" y="616">② preload 参数的作用：是否在 Pod 停止时把独立卷数据回写到 rootfs</text>

  <!-- Default mode -->
  <g filter="url(#shadow)">
    <rect x="60" y="638" width="730" height="297" rx="17" fill="#ffffff"/>
  </g>
  <rect x="60" y="638" width="730" height="49" rx="17" fill="#ecfdf5"/>
  <path d="M60 670 H790 V687 H60 Z" fill="#ecfdf5"/>
  <circle cx="91" cy="662" r="11" fill="#10b981"/>
  <path d="M85 662 l4 4 8 -9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="card-title green" x="115" y="669">默认模式：sysbox-mgr --disable-inner-image-preload=false</text>

  <rect x="88" y="716" width="175" height="74" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="body blue" x="175" y="743" text-anchor="middle" font-weight="700">镜像 / rootfs</text>
  <text class="small" x="175" y="766" text-anchor="middle">预装的内层镜像数据</text>

  <line x1="263" y1="753" x2="354" y2="753" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="small blue" x="309" y="738" text-anchor="middle" font-weight="700">启动：SyncIn</text>

  <rect x="362" y="716" width="175" height="74" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="body green" x="449" y="743" text-anchor="middle" font-weight="700">宿主特殊卷</text>
  <text class="small" x="449" y="766" text-anchor="middle">Pod 运行时实际读写</text>

  <line x1="537" y1="753" x2="628" y2="753" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="635" y="716" width="127" height="74" rx="11" fill="#f0fdfa" stroke="#5eead4"/>
  <text class="body green" x="698" y="743" text-anchor="middle" font-weight="700">运行中</text>
  <text class="small" x="698" y="766" text-anchor="middle">Docker / K3s</text>

  <path d="M625 823 H275" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="body orange" x="450" y="815" text-anchor="middle" font-weight="700">停止 / Pause：SyncOut → rootfs overlay upper</text>
  <rect x="88" y="849" width="674" height="58" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="small orange" x="425" y="873" text-anchor="middle" font-weight="700">结果：运行期间新增的 inner images / runtime state 被写回 rootfs</text>
  <text class="small" x="425" y="894" text-anchor="middle">之后执行 Docker commit / build，系统容器镜像可携带这些预装数据</text>

  <!-- Disabled mode -->
  <g filter="url(#shadow)">
    <rect x="810" y="638" width="730" height="297" rx="17" fill="#ffffff"/>
  </g>
  <rect x="810" y="638" width="730" height="49" rx="17" fill="#fff7ed"/>
  <path d="M810 670 H1540 V687 H810 Z" fill="#fff7ed"/>
  <circle cx="841" cy="662" r="11" fill="#f97316"/>
  <path d="M835 656 L847 668 M847 656 L835 668" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text class="card-title orange" x="865" y="669">禁用模式：sysbox-mgr --disable-inner-image-preload=true</text>

  <rect x="838" y="716" width="175" height="74" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="body blue" x="925" y="743" text-anchor="middle" font-weight="700">镜像 / rootfs</text>
  <text class="small" x="925" y="766" text-anchor="middle">已有预装数据仍可用</text>

  <line x1="1013" y1="753" x2="1104" y2="753" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="small blue" x="1059" y="738" text-anchor="middle" font-weight="700">仍然 SyncIn</text>

  <rect x="1112" y="716" width="175" height="74" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="body green" x="1199" y="743" text-anchor="middle" font-weight="700">宿主特殊卷</text>
  <text class="small" x="1199" y="766" text-anchor="middle">Pod 运行时实际读写</text>

  <line x1="1287" y1="753" x2="1378" y2="753" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="1385" y="716" width="127" height="74" rx="11" fill="#f0fdfa" stroke="#5eead4"/>
  <text class="body green" x="1448" y="743" text-anchor="middle" font-weight="700">运行中</text>
  <text class="small" x="1448" y="766" text-anchor="middle">Docker / K3s</text>

  <path d="M1375 823 H1025" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="1199" cy="823" r="16" fill="#fee2e2" stroke="#ef4444"/>
  <path d="M1192 816 L1206 830 M1206 816 L1192 830" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text class="body red" x="1199" y="854" text-anchor="middle" font-weight="700">停止：跳过 SyncOut</text>
  <rect x="838" y="869" width="674" height="38" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text class="small red" x="1175" y="893" text-anchor="middle" font-weight="700">结果：停止更快；新增数据不回写 rootfs，也不会进入后续 commit 的镜像</text>

  <!-- Sync operation details -->
  <text class="section" x="60" y="980">③ SyncIn / SyncOut 实际执行什么：在 rootfs 与宿主特殊卷之间运行 rsync</text>

  <g filter="url(#shadow)">
    <rect x="60" y="1000" width="730" height="205" rx="17" fill="#ffffff"/>
  </g>
  <rect x="60" y="1000" width="730" height="45" rx="17" fill="#eff6ff"/>
  <path d="M60 1028 H790 V1045 H60 Z" fill="#eff6ff"/>
  <text class="card-title blue" x="88" y="1029">SyncIn · 创建特殊卷时、Pod 启动前</text>
  <rect x="88" y="1060" width="252" height="57" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="small" x="214" y="1082" text-anchor="middle">源：镜像 / 容器 rootfs</text>
  <text class="small mono blue" x="214" y="1104" text-anchor="middle">&lt;rootfs&gt;/&lt;指定目录&gt;/</text>
  <line x1="340" y1="1088" x2="468" y2="1088" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="tiny blue" x="404" y="1077" text-anchor="middle">复制已有内容</text>
  <rect x="475" y="1060" width="287" height="57" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="small" x="618" y="1082" text-anchor="middle">目标：宿主 per-container 特殊卷</text>
  <text class="small mono green" x="618" y="1104" text-anchor="middle">/var/lib/sysbox/&lt;type&gt;/&lt;id&gt;/</text>
  <text class="small" x="88" y="1145"><tspan font-weight="700" fill="#1d4ed8">随后：</tspan>特殊卷 rbind 到 Pod 指定目录，Pod 运行期间直接读写该卷。</text>
  <text class="small" x="88" y="1171"><tspan font-weight="700" fill="#1d4ed8">用途：</tspan>让系统容器镜像中预装的 inner images / runtime data 在启动后可见。</text>
  <text class="small" x="88" y="1197"><tspan font-weight="700" fill="#1d4ed8">属主：</tspan>需要 user namespace 转换时执行 UID/GID shift-up。</text>

  <g filter="url(#shadow)">
    <rect x="810" y="1000" width="730" height="205" rx="17" fill="#ffffff"/>
  </g>
  <rect x="810" y="1000" width="730" height="45" rx="17" fill="#fff7ed"/>
  <path d="M810 1028 H1540 V1045 H810 Z" fill="#fff7ed"/>
  <text class="card-title orange" x="838" y="1029">SyncOut · Pod 停止 / Pause / sysbox-mgr 退出时</text>
  <rect x="838" y="1060" width="287" height="57" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="small" x="981" y="1082" text-anchor="middle">源：宿主 per-container 特殊卷</text>
  <text class="small mono green" x="981" y="1104" text-anchor="middle">/var/lib/sysbox/&lt;type&gt;/&lt;id&gt;/</text>
  <line x1="1125" y1="1088" x2="1253" y2="1088" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="tiny orange" x="1189" y="1077" text-anchor="middle">反向回写</text>
  <rect x="1260" y="1060" width="252" height="57" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text class="small" x="1386" y="1082" text-anchor="middle">目标：容器 rootfs</text>
  <text class="small mono orange" x="1386" y="1104" text-anchor="middle">overlay → upperdir/&lt;目录&gt;/</text>
  <text class="small" x="838" y="1145"><tspan font-weight="700" fill="#c2410c">触发：</tspan>正常停止且非 autoRemove、Pause，以及 manager 关闭清理阶段。</text>
  <text class="small" x="838" y="1171"><tspan font-weight="700" fill="#c2410c">用途：</tspan>把运行期变化写回 rootfs，供后续 commit / build 制作预装镜像。</text>
  <text class="small" x="838" y="1197"><tspan font-weight="700" fill="#c2410c">属主：</tspan>需要 user namespace 转换时执行 UID/GID shift-down。</text>

  <rect x="60" y="1222" width="1480" height="35" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="small mono" x="800" y="1245" text-anchor="middle">两者均使用：rsync -rauqlH --no-devices --delete　·　保持权限/硬链接　·　不复制设备文件　·　删除目标中源已不存在的条目</text>

  <!-- Footer legend -->
  <line x1="60" y1="1270" x2="1540" y2="1270" stroke="#cbd5e1"/>
  <line x1="80" y1="1288" x2="124" y2="1288" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="136" y="1292">启动复制（SyncIn）</text>
  <line x1="315" y1="1288" x2="359" y2="1288" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="tiny" x="371" y="1292">停止回写（SyncOut）</text>
  <line x1="568" y1="1288" x2="612" y2="1288" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="624" y="1292">bind mount / 运行时读写</text>
  <text class="tiny" x="1540" y="1292" text-anchor="end">当前行为：特殊挂载与 preload 开关相互独立</text>
</svg>
