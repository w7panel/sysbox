apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nested-rootfs-persistence
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nested-rootfs-persistence
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nested-rootfs-persistence
  template:
    metadata:
      labels:
        app: nested-rootfs-persistence
      annotations:
        sysbox/rootfs-rw-layer: '[{"name":"system","volumeName":"rootfs","path":"system"}]'
        sysbox/allow-proc-exec: "true"
    spec:
      runtimeClassName: sysbox-runc
      enableServiceLinks: false
      terminationGracePeriodSeconds: 0
      containers:
        - name: system
          image: ccr.ccs.tencentyun.com/afan-public/nginx:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec sleep infinity
      volumes:
        - name: rootfs
          persistentVolumeClaim:
            claimName: nested-rootfs-persistence
