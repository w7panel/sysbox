apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sysbox-inner-k3s-rootfs-poc
  namespace: k3k-console-164315
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysbox-inner-k3s-rootfs-poc
  namespace: k3k-console-164315
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sysbox-inner-k3s-rootfs-poc
  template:
    metadata:
      labels:
        app: sysbox-inner-k3s-rootfs-poc
      annotations:
        sysbox/allow-proc-exec: "true"
        sysbox/rootfs-rw-layer: '[{"name":"k3s","volumeName":"rootfs","path":"rootfs","persistentSpecialMounts":true}]'
    spec:
      runtimeClassName: sysbox-runc
      hostUsers: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: copy-sysbox
          image: docker.cnb.cool/i0358/zpk/sysbox-inner-k3s-copyhelper:20260814-rootfs-test-3
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - cp -a /payload/bin /payload/scripts /work/
          volumeMounts:
            - name: sysbox
              mountPath: /work
      containers:
        - name: k3s
          image: rancher/k3s:v1.35.6-k3s1
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: K3S_PAUSE_IMAGE
              value: docker.cnb.cool/i0358/zpk/nested-pause:20260810-1
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - /bin/sh
            - -ec
            - |
              mount --make-rshared /
              mount --bind /run /run
              mount --make-rshared /run
              mkdir -p /var/lib/sysbox-inner/bin
              cp -a /opt/sysbox/bin/generic/. /var/lib/sysbox-inner/bin/
              SYSBOX_INNER_BIN_DIR=/var/lib/sysbox-inner/bin \
              SYSBOX_INNER_DATA_ROOT=/var/lib/rancher/k3s/sysbox-inner \
              SYSBOX_INNER_SNAPSHOTTER_SOCKET=/run/sysbox/sysbox-snapshotter.sock \
                /bin/sh /opt/sysbox/scripts/sysbox-inner-k3s.sh
              mkdir -p /var/lib/rancher/k3s/agent/etc/cni/net.d
              printf '%s\n' '{"cniVersion":"1.0.0","name":"nested-bridge","plugins":[{"type":"bridge","bridge":"cni0","isGateway":true,"ipMasq":true,"ipam":{"type":"host-local","subnet":"10.244.0.0/16","routes":[{"dst":"0.0.0.0/0"}]}},{"type":"portmap","capabilities":{"portMappings":true}}]}' > /var/lib/rancher/k3s/agent/etc/cni/net.d/10-nested-bridge.conflist
              run_k3s() {
                /bin/k3s server \
                  --cluster-init \
                  --cluster-cidr=10.244.0.0/16 \
                  --service-cidr=10.246.0.0/16 \
                  --cluster-dns=10.246.0.10 \
                  --flannel-backend=none \
                  --disable=traefik \
                  --disable=servicelb \
                  --disable-network-policy \
                  --kubelet-arg='eviction-hard=nodefs.available<1Gi,imagefs.available<1Gi' \
                  --pause-image="${K3S_PAUSE_IMAGE}" \
                  --node-name=nested-rootfs-poc \
                  --node-ip="${POD_IP}" \
                  "$@"
              }
              if [ -d /var/lib/rancher/k3s/server/db/etcd ]; then
                rm -f /var/lib/rancher/k3s/server/db/reset-flag
                run_k3s --cluster-reset
                rm -f /var/lib/rancher/k3s/server/db/reset-flag
              fi
              run_k3s
          volumeMounts:
            - name: registries
              mountPath: /etc/rancher/k3s/registries.yaml
              subPath: registries.yaml
              readOnly: true
            - name: sysbox
              mountPath: /opt/sysbox
            - name: fuse
              mountPath: /dev/fuse
      volumes:
        - name: registries
          configMap:
            name: sysbox-nested-registries
        - name: sysbox
          emptyDir: {}
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: rootfs
          persistentVolumeClaim:
            claimName: sysbox-inner-k3s-rootfs-poc
